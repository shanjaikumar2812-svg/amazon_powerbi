          - Connect Usb Type-C Enabled Devices (Macbook, Chromebook Pixel, Galaxy Note 7 Etc.) With Standard Usb Type-C 2.0 Enabled Devices And Accessories (Smartphones, Car/Wall Charger, Multi-Port Adapters Etc.)|Up To 480 Mbps Data Transfer Speed; Power Output Up To 5V, 3 Amp|Type-C Port Is Half The Width And One-Third The Height Of A Standard Usb-A Connector (Slightly Larger Compared To Lightning Or Micro-Usb Ports)|Certified By Usb-If To Be Compliant With Usb 2.0; 1 Year Limited Warranty|Ideal For Charging And Powering Usb Type-C Enabled Devices, As Well As Syncing Data, Photos And Music|Reversible Design - Easily Insert The Connector Into Any Type-C Enabled Device (Does Not Matter Which Side Is Up)
  - name: FLIPKART
    description: The table contains records of electronic devices listed on an e-commerce platform. Each record represents a single product and includes details about the device's specifications such as brand, model, color, memory, and storage, as well as pricing and customer ratings.
    base_table:
      database: ECOMMERCE
      schema: ECOM
      table: FLIPKART
    dimensions:
      - name: BRAND
        description: The brand name of the product listed on the platform.
        expr: BRAND
        data_type: VARCHAR
        sample_values:
          - IQOO
          - OPPO
          - Google Pixel
      - name: COLOR
        description: The color of the product.
        expr: COLOR
        data_type: VARCHAR
        sample_values:
          - Auroral Blue
          - Aurora Blue
          - Electric Black
      - name: MEMORY
        description: The memory capacity of a product expressed in units such as megabytes or gigabytes.
        expr: MEMORY
        data_type: VARCHAR
        sample_values:
          - 6 GB
          - 3 GB
          - 4 GB
      - name: MODEL
        description: The model name of a mobile device listed on the platform.
        expr: MODEL
        data_type: VARCHAR
        sample_values:
          - A53s 5G
          - A15S
          - A53
      - name: ORIGINAL_PRICE
        description: The original listed price of a product before any discounts or promotions are applied.
        expr: ORIGINAL_PRICE
        data_type: NUMBER
        sample_values:
          - '7007'
          - '6295'
          - '17194'
      - name: SELLING_PRICE
        description: The selling price of a product listed on the platform.
        expr: SELLING_PRICE
        data_type: NUMBER
        sample_values:
          - '13990'
          - '9490'
          - '57999'
      - name: STORAGE
        description: The storage capacity of a product expressed in standard units of digital measurement.
        expr: STORAGE
        data_type: VARCHAR
        sample_values:
          - 128 GB
          - 64 GB
          - 32 GB
    facts:
      - name: RATING
        description: The numerical rating assigned to a product on a scale reflecting customer satisfaction.
        expr: RATING
        data_type: NUMBER
        sample_values:
          - '4.5'
          - '4.3'
          - '4.4'